server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent internal container port redirects behind Coolify / Traefik proxy
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 256;

    # Coolify healthcheck endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Redirect /index.html to / and any /page.html to clean /page
    if ($request_uri ~ ^/index\.html(\?|$)) {
        return 301 /;
    }
    if ($request_uri ~ ^/(.+)\.html(\?|$)) {
        return 301 /$1;
    }

    # Serve clean extensionless URLs (/privacy -> privacy.html) without .html or trailing slash redirects
    location / {
        try_files $uri.html $uri $uri/index.html =404;
    }

    # Cache static assets
    location ~* \.(css|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
